# ========================================================
# Internship Eligibility Checker - Spring Boot Properties
# ========================================================

# Server Port (dynamically binds to cloud platform $PORT, default 8080)
server.port=${PORT:8080}
spring.application.name=internship-eligibility-checker

# Database Configuration (supports cloud environment variables, fallback to embedded H2)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/internshipdb;MODE=MySQL;DB_CLOSE_DELAY=-1}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Hibernate / JPA Configuration
spring.jpa.database-platform=${JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# H2 Database Web Console
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Static Web Resources (React SPA frontend)
spring.web.resources.static-locations=classpath:/static/
