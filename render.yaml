services:
  - type: web
    name: internship-eligibility-checker
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: default
      # For MySQL deployment, uncomment and supply your database credentials:
      # - key: SPRING_PROFILES_ACTIVE
      #   value: prod
      # - key: SPRING_DATASOURCE_URL
      #   value: jdbc:mysql://<db-host>:<port>/<db-name>?useSSL=true
      # - key: SPRING_DATASOURCE_USERNAME
      #   value: <db-user>
      # - key: SPRING_DATASOURCE_PASSWORD
      #   value: <db-password>
